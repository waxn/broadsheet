[package]
name = "broadsheet"
version = "0.1.0"
edition = "2021"
build = "build.rs"
publish = false

[lib]
name = "broadsheet"
path = "src/lib.rs"

[[bin]]
name = "broadsheet"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

# Password hashing is the one heavy computation; keep dependencies fast in debug/test builds too.
[profile.dev.package."*"]
opt-level = 3

[dependencies]
base64 = "0.23.1"
getrandom = "0.4.3"
pbkdf2 = "0.13.0"
rusqlite = { version = "0.41.0", features = ["bundled"] }
serde_json = "1.0.154"
sha2 = "0.11.1"

[build-dependencies]
flate2 = "1.1.10"
