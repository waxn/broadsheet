name: broadsheet

services:
  broadsheet:
    build: .
    image: broadsheet:latest
    container_name: broadsheet
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_PATH: /data/broadsheet.db
      HOST: 0.0.0.0
      PORT: 8000
    ports:
      - "${PORT_HOST:-8080}:8000"
    volumes:
      - broadsheet_data:/data
    # Room for a 25 MB upload in flight; idle use stays around 6 MB.
    mem_limit: 96m
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

volumes:
  broadsheet_data:
